[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencerag"
version = "0.1.0"
description = "Evaluation-driven RAG system over ML/AI research papers (BM25 vs dense vs hybrid vs hybrid+rerank, custom vs LangChain)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pranjal Kirar" }]
keywords = ["rag", "information-retrieval", "nlp", "evaluation", "research"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

# Milestone 1 scope: only the foundation needs a runtime dependency.
# python-dotenv backs the config module's environment-variable path
# overrides (e.g. pointing EVIDENCERAG_DATA_DIR elsewhere on Kaggle).
# ML/retrieval dependencies (torch, transformers, faiss, langchain, ...)
# are intentionally NOT added yet; they land with each component.
dependencies = [
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

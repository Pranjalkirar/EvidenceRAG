[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencerag"
version = "0.1.0"
description = "Evaluation-driven RAG system over ML/AI research papers (BM25 vs dense vs hybrid vs hybrid+rerank, custom vs LangChain)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pranjal Kirar" }]
keywords = ["rag", "information-retrieval", "nlp", "evaluation", "research"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

# python-dotenv backs the config module's environment-variable path
# overrides (e.g. pointing EVIDENCERAG_DATA_DIR elsewhere on Kaggle).
# datasets is the canonical distribution channel for QASPER (Milestone 2
# ingestion). Milestone 4 adds the retrieval baseline: rank-bm25 (sparse),
# faiss-cpu + sentence-transformers (dense, Qwen3-Embedding-0.6B).
# Milestone 6 adds the generation stage: transformers (Qwen3-4B-Instruct-2507,
# loaded via AutoModelForCausalLM/AutoTokenizer directly, not through
# sentence-transformers) -- torch itself is already pulled in transitively by
# sentence-transformers, so it is not listed again here. LangChain and
# evaluation dependencies are intentionally NOT added yet; they land with
# each component as it is implemented.
dependencies = [
    "python-dotenv>=1.0,<2.0",
    "datasets>=2.19,<3.0",
    "numpy>=1.26,<3.0",
    "rank-bm25>=0.2,<0.3",
    "faiss-cpu>=1.8,<2.0",
    "sentence-transformers>=3.0,<4.0",
    "transformers>=4.40,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
